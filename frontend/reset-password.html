<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe | AlphaIT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-alphait">
    <div class="container">
      <a class="navbar-brand" href="index.html">Alpha<span>IT</span></a>
    </div>
  </nav>

  <section class="py-5" style="background-color: var(--alphait-bg-light); min-height: 85vh;">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="testimonial-card" style="border-left: none; border-top: 4px solid var(--alphait-accent);">
            <h5 class="mb-4">Choisir un nouveau mot de passe</h5>

            <div class="alert d-none" id="resetAlert" role="alert"></div>

            <form id="resetPasswordForm" novalidate>
              <div class="mb-3">
                <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                <input type="password" class="form-control" id="newPassword" required minlength="6">
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                <input type="password" class="form-control" id="confirmPassword" required>
              </div>
              <button type="submit" class="btn btn-alphait-accent w-100">Réinitialiser le mot de passe</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/reset-password.js"></script>

</body>
</html>
